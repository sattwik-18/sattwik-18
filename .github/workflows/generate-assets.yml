name: Generate Flagship Dashboard Assets

on:
  # Trigger automatically every 24 hours
  schedule:
    - cron: "0 0 * * *"
  
  # Allow manual execution via the Actions control panel
  workflow_dispatch:
  
  # Run on every push to the main branch to ensure immediate synchronization
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      # Checkout the repository to access config states
      - name: Checkout Repository
        uses: actions/checkout@v3

      # Compile the custom Cyberpunk Contribution Snake SVG
      - name: Compile Contribution Snake Graph
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-dark&color_snake=%2300F0FF&color_dots=%231E293B,%230D423E,%230E6354,%23139369,%2339FF14
            dist/github-contribution-grid-snake-cyberpunk.svg?color_snake=%2300F0FF&color_dots=%23090d16,%231E293B,%23BD00FF,%2300F0FF,%2339FF14

      # Compile the 3D Isometric Contribution Grid SVGs
      - name: Compile 3D Isometric Contribution Graph
        uses: yoshi389111/github-profile-3d-contrib@0.7.1
        with:
          github_user_name: ${{ github.repository_owner }}
          # Generates files under profile-3d-contrib/
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Compile and cache static custom themed stats cards
      - name: Compile and Cache Static Stats Cards
        run: |
          mkdir -p dist
          curl -s -L -o dist/github-stats.svg "https://github-readme-stats.vercel.app/api?username=${{ github.repository_owner }}&show_icons=true&bg_color=050811&title_color=00F0FF&text_color=E2E8F0&icon_color=BD00FF&border_color=1E293B&hide_border=false"
          curl -s -L -o dist/top-langs.svg "https://github-readme-stats.vercel.app/api/top-langs?username=${{ github.repository_owner }}&layout=compact&bg_color=050811&title_color=00F0FF&text_color=E2E8F0&border_color=1E293B"
          curl -s -L -o dist/streak-stats.svg "https://github-readme-streak-stats.herokuapp.com/?user=${{ github.repository_owner }}&bg_color=050811&title_color=00F0FF&text_color=E2E8F0&sideNums=BD00FF&sideLabels=64748B&ring=00F0FF&fire=BD00FF&border=1E293B&hide_border=false"

      # Restructure directories for deployment
      - name: Consolidate Asset Directory
        run: |
          mkdir -p dist
          if [ -d "profile-3d-contrib" ]; then
            mv -v profile-3d-contrib dist/
          fi

      # Deploy generated assets to the 'output' branch for ultra-high-speed CDN delivery
      - name: Deploy Assets to Branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
