name: Generate Flagship Dashboard Assets

on:
  # Trigger automatically every 24 hours
  schedule:
    - cron: "0 0 * * *"
  
  # Allow manual execution via the Actions control panel
  workflow_dispatch:
  
  # Run on every push to the main branch to ensure immediate synchronization
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      # Checkout the repository to access config states
      - name: Checkout Repository
        uses: actions/checkout@v3

      # Compile the custom Cyberpunk Contribution Snake SVG
      - name: Compile Contribution Snake Graph
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-dark&color_snake=%2300F0FF&color_dots=%231E293B,%230D423E,%230E6354,%23139369,%2339FF14
            dist/github-contribution-grid-snake-cyberpunk.svg?color_snake=%2300F0FF&color_dots=%23090d16,%231E293B,%23BD00FF,%2300F0FF,%2339FF14

      # Compile the 3D Isometric Contribution Grid SVGs
      - name: Compile 3D Isometric Contribution Graph
        uses: yoshi389111/github-profile-3d-contrib@0.7.1
        # Generates files under profile-3d-contrib/
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}



      # Restructure directories for deployment
      - name: Consolidate Asset Directory
        run: |
          mkdir -p dist
          if [ -d "profile-3d-contrib" ]; then
            mv -v profile-3d-contrib dist/
          fi

      # Deploy generated assets to the 'output' branch for ultra-high-speed CDN delivery
      - name: Deploy Assets to Branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
