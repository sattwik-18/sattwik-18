<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 220" width="100%" height="220">
  <defs>
    <!-- Dark glassmorphic background gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811" />
      <stop offset="100%" stop-color="#0B132B" />
    </linearGradient>
    
    <!-- Neon Cyan Border Glow -->
    <filter id="cyan-glow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Typing clip paths to reveal lines sequentially -->
    <clipPath id="clip-line-1">
      <rect x="25" y="55" width="0" height="25">
        <animate attributeName="width" from="0" to="700" dur="1.2s" begin="0.3s" fill="freeze" keyTimes="0; 1" keySplines="0.4, 0, 0.2, 1" calcMode="spline" />
      </rect>
    </clipPath>
    
    <clipPath id="clip-line-2">
      <rect x="25" y="85" width="0" height="25">
        <animate attributeName="width" from="0" to="700" dur="1.0s" begin="1.8s" fill="freeze" keyTimes="0; 1" keySplines="0.4, 0, 0.2, 1" calcMode="spline" />
      </rect>
    </clipPath>
    
    <clipPath id="clip-line-3">
      <rect x="25" y="115" width="0" height="25">
        <animate attributeName="width" from="0" to="700" dur="1.4s" begin="3.1s" fill="freeze" keyTimes="0; 1" keySplines="0.4, 0, 0.2, 1" calcMode="spline" />
      </rect>
    </clipPath>

    <clipPath id="clip-line-4">
      <rect x="25" y="145" width="0" height="25">
        <animate attributeName="width" from="0" to="700" dur="1.2s" begin="4.8s" fill="freeze" keyTimes="0; 1" keySplines="0.4, 0, 0.2, 1" calcMode="spline" />
      </rect>
    </clipPath>
    
    <clipPath id="clip-line-5">
      <rect x="25" y="175" width="0" height="25">
        <animate attributeName="width" from="0" to="700" dur="0.8s" begin="6.3s" fill="freeze" keyTimes="0; 1" keySplines="0.4, 0, 0.2, 1" calcMode="spline" />
      </rect>
    </clipPath>
  </defs>

  <style>
    .terminal-body {
      stroke: #1E293B;
      stroke-width: 1.5;
    }
    .window-dot {
      stroke-width: 0;
    }
    .term-title {
      font-family: 'Fira Code', Consolas, Monaco, monospace;
      font-size: 11px;
      fill: #475569;
      text-anchor: middle;
    }
    .term-text {
      font-family: 'Fira Code', Consolas, Monaco, monospace;
      font-size: 13px;
      fill: #E2E8F0;
    }
    .prompt {
      fill: #00F0FF;
      font-weight: bold;
    }
    .cmd {
      fill: #F8FAFC;
    }
    .bracket {
      fill: #64748B;
    }
    .status-ok {
      fill: #39FF14;
      font-weight: bold;
    }
    .status-active {
      fill: #BD00FF;
      font-weight: bold;
    }
    .status-warn {
      fill: #FFBD2E;
    }
    .blinking-cursor {
      fill: #00F0FF;
      opacity: 0;
      animation: cursor-blink 1.0s infinite;
    }
    @keyframes cursor-blink {
      0%, 49% { opacity: 0; }
      50%, 100% { opacity: 1; }
    }
  </style>

  <!-- Outer Card Frame with subtle neon cyan corner pulse -->
  <rect x="2" y="2" width="756" height="216" rx="8" fill="url(#bg-grad)" class="terminal-body" />

  <!-- Terminal Window Header Bar -->
  <path d="M 2 10 A 8 8 0 0 1 10 2 L 750 2 A 8 8 0 0 1 758 10 L 758 32 L 2 32 Z" fill="#0B132B" opacity="0.7"/>
  
  <!-- Window Controls -->
  <circle cx="20" cy="17" r="5" fill="#FF5F56" class="window-dot" />
  <circle cx="36" cy="17" r="5" fill="#FFBD2E" class="window-dot" />
  <circle cx="52" cy="17" r="5" fill="#27C93F" class="window-dot" />

  <text x="380" y="20" class="term-title">sattwik@iem-ai-deck: ~</text>

  <!-- Line 1: Terminal prompt command execution -->
  <g clip-path="url(#clip-line-1)">
    <text x="25" y="70" class="term-text">
      <tspan class="prompt">guest@sattwik-18:~$</tspan> <tspan class="cmd">init --ai-deck --verbose</tspan>
    </text>
  </g>

  <!-- Line 2: Diagnostic Check -->
  <g clip-path="url(#clip-line-2)">
    <text x="25" y="100" class="term-text">
      <tspan class="bracket">[</tspan><tspan class="status-ok">SYS_OK</tspan><tspan class="bracket">]</tspan> Neural nodes mapped successfully. Loading profiles...
    </text>
  </g>

  <!-- Line 3: Focal Priorities -->
  <g clip-path="url(#clip-line-3)">
    <text x="25" y="130" class="term-text">
      <tspan class="bracket">[</tspan><tspan class="status-active">ACTIVE</tspan><tspan class="bracket">]</tspan> Track: CSE (AI &amp; ML) at IEM | Focus: DS&amp;A, Neural Architectures, Systems
    </text>
  </g>

  <!-- Line 4: System Readiness -->
  <g clip-path="url(#clip-line-4)">
    <text x="25" y="160" class="term-text">
      <tspan class="bracket">[</tspan><tspan class="status-active">TARGET</tspan><tspan class="bracket">]</tspan> Training: Generative AI Pipelines &amp; End-to-End Product Design
    </text>
  </g>

  <!-- Line 5: Interactive Terminal prompt waiting state -->
  <g clip-path="url(#clip-line-5)">
    <text x="25" y="190" class="term-text">
      <tspan class="prompt">guest@sattwik-18:~$</tspan> <tspan class="cmd">system_status --listen</tspan>
    </text>
  </g>

  <!-- Blinking Cursor following final typing sequence (displays immediately at coordinate) -->
  <rect x="294" y="177" width="8" height="15" class="blinking-cursor">
    <animate attributeName="x" from="25" to="294" dur="0.8s" begin="6.3s" fill="freeze" keyTimes="0; 1" keySplines="0.4, 0, 0.2, 1" calcMode="spline" />
    <animate attributeName="opacity" values="0; 0; 1" keyTimes="0; 0.9; 1" dur="7.1s" fill="freeze" />
  </rect>
</svg>
