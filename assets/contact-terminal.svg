<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 160" width="100%" height="160">
  <defs>
    <!-- Glassmorphic slate background gradient -->
    <linearGradient id="terminal-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811" />
      <stop offset="100%" stop-color="#0B132B" />
    </linearGradient>

    <!-- Glowing accents -->
    <filter id="neon-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Sequenced line reveal animations -->
    <clipPath id="clip-c1">
      <rect x="25" y="45" width="0" height="20">
        <animate attributeName="width" from="0" to="700" dur="0.8s" begin="0.2s" fill="freeze" keyTimes="0; 1" keySplines="0.4, 0, 0.2, 1" calcMode="spline" />
      </rect>
    </clipPath>
    <clipPath id="clip-c2">
      <rect x="25" y="70" width="0" height="20">
        <animate attributeName="width" from="0" to="700" dur="1.0s" begin="1.2s" fill="freeze" keyTimes="0; 1" keySplines="0.4, 0, 0.2, 1" calcMode="spline" />
      </rect>
    </clipPath>
    <clipPath id="clip-c3">
      <rect x="25" y="95" width="0" height="60">
        <animate attributeName="width" from="0" to="700" dur="1.2s" begin="2.4s" fill="freeze" keyTimes="0; 1" keySplines="0.4, 0, 0.2, 1" calcMode="spline" />
      </rect>
    </clipPath>
  </defs>

  <style>
    .window-body {
      stroke: #1E293B;
      stroke-width: 1.5;
    }
    .win-dot {
      stroke-width: 0;
    }
    .header-text {
      font-family: 'Fira Code', Consolas, Monaco, monospace;
      font-size: 10px;
      fill: #475569;
      text-anchor: middle;
    }
    .cli-text {
      font-family: 'Fira Code', Consolas, Monaco, monospace;
      font-size: 12px;
      fill: #E2E8F0;
    }
    .cli-prompt {
      fill: #00F0FF;
      font-weight: bold;
    }
    .cli-cmd {
      fill: #F8FAFC;
    }
    .cli-bracket {
      fill: #64748B;
    }
    .cli-ok {
      fill: #39FF14;
      font-weight: bold;
    }
    .cli-highlight-cyan {
      fill: #00F0FF;
    }
    .cli-highlight-magenta {
      fill: #BD00FF;
    }
    .active-cursor {
      fill: #00F0FF;
      opacity: 0;
      animation: cursor-pulse 1s infinite;
    }
    @keyframes cursor-pulse {
      0%, 49% { opacity: 0; }
      50%, 100% { opacity: 1; }
    }
  </style>

  <!-- Outer Console Frame -->
  <rect x="2" y="2" width="756" height="156" rx="6" fill="url(#terminal-bg)" class="window-body" />

  <!-- Window controls -->
  <circle cx="20" cy="18" r="4.5" fill="#FF5F56" class="win-dot" />
  <circle cx="34" cy="18" r="4.5" fill="#FFBD2E" class="win-dot" />
  <circle cx="48" cy="18" r="4.5" fill="#27C93F" class="win-dot" />
  <text x="380" y="21" class="header-text">guest@sattwik-18: ~/secure-channels</text>
  <line x1="2" y1="32" x2="758" y2="32" stroke="#1E293B" stroke-width="1" />

  <!-- Line 1: Typing prompt -->
  <g clip-path="url(#clip-c1)">
    <text x="25" y="58" class="cli-text">
      <tspan class="cli-prompt">guest@sattwik-18:~$</tspan> <tspan class="cli-cmd">connect --secure --active-channels</tspan>
    </text>
  </g>

  <!-- Line 2: System linking progress bar -->
  <g clip-path="url(#clip-c2)">
    <text x="25" y="83" class="cli-text">
      <tspan class="cli-bracket">[</tspan><tspan class="cli-ok">SUCCESS</tspan><tspan class="cli-bracket">]</tspan> Channel Handshakes Established. Telemetry Matrix online.
    </text>
  </g>

  <!-- Line 3: Detailed Coordinates -->
  <g clip-path="url(#clip-c3)">
    <text x="25" y="108" class="cli-text">
      ├─ 💼 <tspan class="cli-highlight-cyan">LINKEDIN</tspan> ────── <tspan fill="#F8FAFC">/in/sattwik-datta-2a70a62ab</tspan>
    </text>
    <text x="25" y="126" class="cli-text">
      ├─ 📧 <tspan class="cli-highlight-magenta">EMAIL</tspan> ───────── <tspan fill="#F8FAFC">sattwikdatta.6@gmail.com</tspan>
    </text>
    <text x="25" y="144" class="cli-text">
      └─ 🏆 <tspan class="cli-ok">LEETCODE</tspan> ────── <tspan fill="#F8FAFC">/u/sattwik-18</tspan>
    </text>
  </g>

  <!-- Blinking Cursor following typing sequence -->
  <rect x="290" y="132" width="7" height="13" class="active-cursor">
    <animate attributeName="x" from="25" to="290" dur="1.2s" begin="2.4s" fill="freeze" keyTimes="0; 1" keySplines="0.4, 0, 0.2, 1" calcMode="spline" />
    <animate attributeName="opacity" values="0; 0; 1" keyTimes="0; 0.95; 1" dur="3.7s" fill="freeze" />
  </rect>
</svg>
