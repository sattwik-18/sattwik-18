<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 220" width="100%" height="220">
  <defs>
    <!-- Cabinet background gradient -->
    <linearGradient id="arcade-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#02040A" />
      <stop offset="100%" stop-color="#0B132B" />
    </linearGradient>

    <!-- Glowing Lasers & Explosions Filters -->
    <filter id="laser-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="explosion-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .screen-border {
      stroke: #1E293B;
      stroke-width: 1.5;
    }
    .header-text {
      font-family: 'Fira Code', Consolas, Monaco, monospace;
      font-size: 10px;
      fill: #475569;
      letter-spacing: 2px;
    }
    .score-glow {
      fill: #39FF14;
      font-weight: bold;
    }
    .grid-line {
      stroke: #00F0FF;
      stroke-opacity: 0.15;
      stroke-width: 1;
    }
    
    /* Starfield Scrolling Animation */
    .star {
      fill: #F8FAFC;
      animation: driftStars 12s linear infinite;
    }
    @keyframes driftStars {
      0% { transform: translateY(0); }
      100% { transform: translateY(220px); }
    }

    /* Ship Movement */
    .player-ship {
      fill: #00F0FF;
      filter: url(#laser-glow);
      animation: slidePlayer 7s ease-in-out infinite alternate;
    }
    @keyframes slidePlayer {
      0% { transform: translateX(80px); }
      30% { transform: translateX(250px); }
      60% { transform: translateX(180px); }
      100% { transform: translateX(520px); }
    }

    /* Lasers Firing from Ship */
    .laser-beam {
      stroke: #39FF14;
      stroke-width: 2.5;
      stroke-linecap: round;
      filter: url(#laser-glow);
      animation: fireLaser 1.8s linear infinite;
    }
    @keyframes fireLaser {
      0% {
        transform: translate(180px, 160px);
        opacity: 1;
        stroke-dasharray: 20;
        stroke-dashoffset: 0;
      }
      30% {
        transform: translate(350px, 90px);
        opacity: 1;
      }
      50% {
        transform: translate(280px, -50px);
        opacity: 0;
      }
      100% {
        transform: translate(520px, -50px);
        opacity: 0;
      }
    }

    /* Alien Neural Bug Elements */
    .neural-bug {
      fill: #BD00FF;
      filter: url(#explosion-glow);
    }
    .bug-1 { animation: bugOscillate1 3s ease-in-out infinite alternate; }
    .bug-2 { animation: bugOscillate2 4s ease-in-out infinite alternate; }
    .bug-3 { animation: bugOscillate3 3.5s ease-in-out infinite alternate; }

    @keyframes bugOscillate1 {
      0% { transform: translate(150px, 50px); }
      100% { transform: translate(190px, 65px); }
    }
    @keyframes bugOscillate2 {
      0% { transform: translate(350px, 60px) scale(1.1); }
      100% { transform: translate(310px, 45px) scale(0.9); }
    }
    @keyframes bugOscillate3 {
      0% { transform: translate(520px, 55px); }
      100% { transform: translate(480px, 55px); }
    }

    /* Blast Explosion Animation timed with laser impact */
    .blast-wave {
      stroke: #FF007A;
      stroke-width: 1.5;
      fill: none;
      filter: url(#explosion-glow);
      transform-origin: 350px 60px;
      animation: explodeBug 1.8s infinite linear;
    }
    @keyframes explodeBug {
      0%, 25% {
        opacity: 0;
        transform: scale(0);
      }
      28% {
        opacity: 1;
        transform: scale(0.8);
      }
      35% {
        opacity: 0.8;
        transform: scale(2.2);
        stroke-width: 3;
      }
      45%, 100% {
        opacity: 0;
        transform: scale(3.5);
      }
    }
  </style>

  <!-- Arcade Screen Housing -->
  <rect x="2" y="2" width="756" height="216" rx="8" fill="url(#arcade-bg)" class="screen-border" />

  <!-- Retro Horizon Grid Floor -->
  <line x1="0" y1="180" x2="760" y2="180" stroke="#00F0FF" stroke-opacity="0.3" stroke-width="2" />
  <line x1="50" y1="180" x2="-100" y2="220" class="grid-line" />
  <line x1="150" y1="180" x2="30" y2="220" class="grid-line" />
  <line x1="250" y1="180" x2="160" y2="220" class="grid-line" />
  <line x1="350" y1="180" x2="300" y2="220" class="grid-line" />
  <line x1="450" y1="180" x2="440" y2="220" class="grid-line" />
  <line x1="550" y1="180" x2="580" y2="220" class="grid-line" />
  <line x1="650" y1="180" x2="720" y2="220" class="grid-line" />
  <line x1="750" y1="180" x2="860" y2="220" class="grid-line" />

  <!-- Drifting space dust stars (Independent positions) -->
  <circle cx="80" cy="20" r="1" class="star" style="animation-delay: -1s; animation-duration: 9s;" />
  <circle cx="210" cy="90" r="1.5" class="star" style="animation-delay: -4s; animation-duration: 11s;" />
  <circle cx="380" cy="40" r="1" class="star" style="animation-delay: -2s; animation-duration: 7s;" />
  <circle cx="560" cy="110" r="1.2" class="star" style="animation-delay: -7s; animation-duration: 10s;" />
  <circle cx="690" cy="65" r="1" class="star" style="animation-delay: -5s; animation-duration: 8s;" />

  <!-- UI Telemetry Overlays -->
  <text x="25" y="25" class="header-text">OPERATION: DECK-INVADERS v1.0.9</text>
  <text x="540" y="25" class="header-text">SCORE: <tspan class="score-glow">098,420</tspan></text>
  <line x1="20" y1="32" x2="740" y2="32" stroke="#1E293B" stroke-width="1" />

  <!-- Firing Laser Beam -->
  <line x1="0" y1="0" x2="0" y2="-20" class="laser-beam" />

  <!-- Player Defender Spaceship -->
  <g class="player-ship">
    <!-- Body -->
    <polygon points="20,180 10,195 30,195" />
    <polygon points="5,190 35,190 20,172" />
    <!-- Glowing Wings -->
    <rect x="2" y="191" width="4" height="4" fill="#00F0FF" />
    <rect x="34" y="191" width="4" height="4" fill="#00F0FF" />
    <!-- Engine Fire (Orange glow) -->
    <polygon points="17,196 23,196 20,204" fill="#FF5F56" />
  </g>

  <!-- Alien Neural Core Bugs -->
  <!-- Bug Node 1 (Purple Neural Point) -->
  <g class="neural-bug bug-1">
    <circle cx="0" cy="0" r="6" />
    <line x1="-10" y1="0" x2="10" y2="0" stroke="#BD00FF" stroke-width="1.5" />
    <line x1="0" y1="-10" x2="0" y2="10" stroke="#BD00FF" stroke-width="1.5" />
  </g>

  <!-- Bug Node 2 (Center target being fired upon) -->
  <g class="neural-bug bug-2">
    <circle cx="0" cy="0" r="8" fill="#FF007A" />
    <circle cx="0" cy="0" r="3" fill="#E2E8F0" />
    <path d="M-12,0 L12,0 M0,-12 L0,12" stroke="#FF007A" stroke-width="1.5" />
  </g>

  <!-- Bug Node 3 (Right Shield Point) -->
  <g class="neural-bug bug-3">
    <circle cx="0" cy="0" r="6" />
    <line x1="-9" y1="-9" x2="9" y2="9" stroke="#BD00FF" stroke-width="1.5" />
    <line x1="9" y1="-9" x2="-9" y2="9" stroke="#BD00FF" stroke-width="1.5" />
  </g>

  <!-- Explosion Blast Wave (Centered on Bug 2 coordinates 350, 60) -->
  <circle cx="350" cy="60" r="2" class="blast-wave" />
  <circle cx="350" cy="60" r="10" class="blast-wave" style="animation-delay: 0.1s;" />
</svg>
